<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple RPG</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game">
        <h1>⚔️ Welcome to Simple RPG! ⚔️</h1>
                <!-- Main Menu -->
        <section id="mainMenu">
            <button id="startGameMenuButton">Start Game</button>
            <button id="openSettingsButton">Settings</button>
        </section>
        <!-- Settings -->
        <section id="settingsScreen" style="display: none;">
            <h2>⚙️ Settings</h2>
            <div id="settingsControls">
                <div class="settingRow">
                    <label for="textSpeedSelect">Text Speed</label>
                    <select id="textSpeedSelect">
                        <option value="slow">Slow</option>
                        <option value="normal" selected>Normal</option>
                        <option value="fast">Fast</option>
                    </select>
                </div>
                <div class="settingRow">
                    <label for="screenShakeToggle">Screen Shake</label>
                    <input type="checkbox" id="screenShakeToggle" checked>
                </div>
                <div class="settingRow">
                    <label for="confettiToggle">Victory Confetti</label>
                    <input type="checkbox" id="confettiToggle" checked>
                </div>
                <div class="settingRow">
                    <label for="volumeSlider">Sound Volume</label>
                    <input type="range" id="volumeSlider" min="0" max="100" value="50">
                </div>
            </div>
            <button id="closeSettingsButton">⬅ Back</button>
        </section>
        <!-- Character Creation -->
        <section id="startScreen" style="display: none;">
            <button id="backToMenuButton">⬅ Back</button>
            <h2>Choose Your Class</h2>

            <div id="classRow">
                <button class="classButton" data-class="Knight">
                    <span class="classIcon">🗡️</span>
                    <span class="classLabel">Knight</span>
                </button>
                <button class="classButton" data-class="Magician">
                    <span class="classIcon">🧙🏼‍♂️</span>
                    <span class="classLabel">Magician</span>
                </button>
                <button class="classButton" data-class="Samurai">
                    <span class="classIcon">🥷🏻</span>
                    <span class="classLabel">Samurai</span>
                </button>
            </div>

            <div id="classInfo">
                <h2 id="selectedTitle">Select a class above to begin</h2>
                <div id="portrait"></div>
                <div id="classDescription"></div>
                <p id="classStats"></p>

                <div id="heroSetup" style="display: none;">
                    <label for="nameInput">Character Name</label>
                    <input id="nameInput" type="text" placeholder="Enter hero name">

                    <label for="difficultySelectStart">Difficulty</label>
                    <select id="difficultySelectStart">
                        <option value="Easy">Easy</option>
                        <option value="Normal" selected>Normal</option>
                        <option value="Hard">Hard</option>
                    </select>

                    <button id="confirmClassButton">⚔️ Confirm Class</button>
                </div>

                <button id="beginAdventureButton">📖 Continue</button>
            </div>
        </section>

        <!-- Lore / Class Intro Screen -->
        <section id="loreScreen" style="display: none;">
            <div id="loreBox">
                <h2 id="loreTitle"></h2>
                <div id="loreTextWrap">
                    <div id="loreText" class="loreTextStack"></div>
                </div>
                <div id="loreAbilities" class="loreAbilities"></div>
                <button id="loreSkipButton">Skip ▶</button>
                <button id="loreBeginButton" style="display: none;">⚔️ Begin Adventure</button>
            </div>
        </section>

        <!-- Main Game Screen -->
        <section id="battleScreen" style="display: none;">
            <div id="characters">
    </div>

    <div id="log">
    </div>
        <div id="playerStatsBar">
        <span id="playerLevelLabel">Level 1</span>
        <div class="xpBar"><div id="playerXpFill"></div></div>
    </div>
    <div id="actions">
        <button id="attackButton">⚔️ Attack</button>
        <button id="defendButton">🛡️ Defend</button>
        <button id="healButton">🧪 Heal</button>
        <div id="choiceButtons" style="display: none;">
            <button id="nextFoeButton">⚔️ Fight Next Foe</button>
            <button id="fleeButton">🏃 Flee</button>
        </div>
        <button id="playAgainButton" style="display: none;">Play Again</button>
    </div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    </section>
    <section id="victoryScreen" style="display: none;">
        <div id="confettiContainer"></div>
        <h2>🏆 Boss Defeated! 🏆</h2>
        <p id="victoryMessage"></p>
        <button id="continueAdventureButton">⚔️ Continue Adventure</button>
        <button id="victoryPlayAgainButton">🏁 Stop Here</button>
    </section>
    <section id="defeatScreen" style="display: none;">
        <h2>💀 Defeat 💀</h2>
        <p id="defeatMessage"></p>
        <button id="defeatPlayAgainButton">Play Again</button>
    </section>
    <section id="fleeScreen" style="display: none;">
        <h2>🏃 Fled the Battle 🏃</h2>
        <p id="fleeMessage"></p>
        <button id="fleePlayAgainButton">Play Again</button>
    </section>
    <div id="levelUpOverlay" style="display: none;">
        <div id="levelUpBox">
            <h3>⭐ Level Up! Choose a bonus: ⭐</h3>
            <button id="chooseAttackButton">⚔️ Boost Attack</button>
            <button id="chooseDefenseButton">🛡️ Boost Defense</button>
            <button id="chooseHealButton">❤️ Full Heal</button>
        </div>
    </div>
    </div>
    <script src="config.js"></script>
    <script src="assetLoader.js"></script>
    <script src="backgroundManager.js"></script>
    <script src="rpg.js"></script>
    <script src="game.js"></script>
</body>
</html>
